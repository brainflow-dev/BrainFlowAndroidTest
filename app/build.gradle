plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.brainflowplot'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'com.example.brainflowplot'
        minSdk = 31
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro')
        }
    }

    packaging {
        jniLibs {
            // The bundled release AAR contains ready-to-package native libraries.
            // Keeping them avoids requiring every learner to install an NDK just to strip them.
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation files('libs/brainflow-android.aar')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
